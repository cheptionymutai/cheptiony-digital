      - name: Write GCP service account key
        run: echo "${{ secrets.GCP_SA_KEY }}" > "${{ github.workspace }}/gcloud-key.json"

      - name: Verify key and list projects (debug)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ github.workspace }}/gcloud-key.json"
        run: |
          echo "Checking service account file:"
          ls -l "${{ github.workspace }}/gcloud-key.json"
          node -e "console.log('node ok')"
          npx firebase-tools projects:list --debug || true

      - name: Deploy to Firebase Hosting (service-account)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: "${{ github.workspace }}/gcloud-key.json"
        run: npx firebase-tools deploy --only hosting --project cheptiony-digital --debug
