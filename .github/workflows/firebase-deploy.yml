name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies (safe)
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json found — running npm ci"
            npm ci
          elif [ -f package.json ]; then
            echo "package.json found but no lockfile — running npm install"
            npm install
          else
            echo "No package.json or package-lock.json — skipping install"
          fi

      - name: Verify public directory
        run: |
          if [ ! -d public ]; then
            echo "::error::Firebase public folder 'public' not found. Update firebase.json or add your built files to /public."
            echo "Repository root contents:"
            ls -la
            exit 1
          fi

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx firebase-tools deploy --only hosting --project cheptiony-digital --token "$FIREBASE_TOKEN"
